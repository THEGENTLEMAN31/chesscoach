services:
  api:
    build: ./api
    container_name: chesscoach-api
    restart: unless-stopped
    environment:
      - COACH_USERNAME=${COACH_USERNAME:-thegentleman31}
      - ANALYZER_URL=http://analyzer:8002
      - OPENROUTER_KEY
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - BASE_URL=${BASE_URL:-https://chesscoach.btj.mooo.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
    ports:
      # publié sur le host pour que Caddy (host) proxifie /api/ directement
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,json;print(json.load(urllib.request.urlopen('http://127.0.0.1:8001/api/health'))['ok'])"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./data:/app/data
    depends_on:
      - analyzer

  analyzer:
    build: ./analyzer
    container_name: chesscoach-analyzer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,json;print(json.load(urllib.request.urlopen('http://127.0.0.1:8002/health'))['status'])"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./data/cache:/app/cache

  web:
    build: ./web
    container_name: chesscoach-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api